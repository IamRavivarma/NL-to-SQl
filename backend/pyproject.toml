[project]
name = "rag-assistant-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.5",
    "beanie>=2.0",
    "pymongo>=4.10",
    "langchain-core>=1.0",
    "langchain-mongodb>=0.12",
    "langchain-groq>=1.0",
    "langchain-huggingface>=1.0",
    "sentence-transformers>=3.0",
    # scikit-learn 1.9.1's _datasets_pair DLL is blocked by Windows Smart App Control.
    "scikit-learn==1.8.0",
    "langchain-text-splitters>=1.0",
    "langgraph>=1.0",
    "pypdf>=5.0",
    "docx2txt>=0.8",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "httpx>=0.27",
    "fpdf2>=2.8",
    "python-docx>=1.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Mongo clients are bound to one event loop, so all tests share a single loop.
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
pythonpath = ["."]
testpaths = ["tests"]
